name: Bug report
description: Something does not work the way the docs say it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "**Never paste secrets, credentials, or real personal data into this form.**"
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "v0.1.0 or commit sha"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "macOS 15 / Claude Code 2.x / Python 3.11"
